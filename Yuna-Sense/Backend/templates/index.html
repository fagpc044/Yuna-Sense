<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yuna Sense</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>
        <div class="nav-content">
            <h1>Yuna Sense</h1>
        </div>
    </nav>


    <!-- =========================
         CONTAINER PRINCIPAL
    ========================== -->

    <main class="container">


        <!-- =========================
             MENSAGEM DIÁRIA
        ========================== -->

        {% if mensagem_diaria %}

        <section class="mensagem-diaria">

            <h2>Mensagem do dia 🌙</h2>

            <p>
                {{ mensagem_diaria.texto }}
            </p>

        </section>

        {% endif %}


        <!-- =========================
             CHAT
        ========================== -->

        <section class="Fora">

            <div class="Dentro">


                <!-- ÁREA DAS MENSAGENS -->

                <div id="chat">

                    <!--
                        As mensagens do usuário
                        e da Yuna serão colocadas aqui
                        pelo JavaScript.
                    -->

                </div>


                <!-- =========================
                     FORMULÁRIO
                ========================== -->

                <form
                    id="chat-form"
                    class="chat-form"
                >

                    <input
                        type="text"
                        id="mensagem"
                        name="mensagem"
                        placeholder="Digite sua mensagem..."
                        autocomplete="off"
                        required
                    >

                    <button
                        type="submit"
                        id="enviar"
                    >
                        Enviar
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>

   <nav class="navbar">
        <div class="logo">
            Yuna Sense
        </div>

        <div class="nav-links">
            <a href="{{ url_for('perfil') }}">Meu perfil</a>
        </div>
    </nav>


    <!-- =========================
         CONTAINER PRINCIPAL
    ========================== -->

    <div class="container">


        <!-- =========================
             CHAT
        ========================== -->

        <div class="Fora">

            <div class="Dentro">


                <!-- MENSAGENS -->

                <div id="mensagens"></div>


                <!-- INPUT -->

                <div class="input-area">

                    <input
                        type="text"
                        id="entrada-usuario"
                        placeholder="Digite aqui..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        onclick="enviar()"
                        aria-label="Enviar mensagem"
                    ></button>

                </div>

            </div>

        </div>



        <!-- =========================
             LATERAL
        ========================== -->

        <div class="lateral">


            <!-- =========================
                 MENSAGEM DO DIA
            ========================== -->

            <div class="mensagem-diaria">

                <h2>Mensagem do dia</h2>


                {% if mensagem_diaria %}

                    <p>
                        {{ mensagem_diaria.texto }}
                    </p>

                {% else %}

                    <p>
                        Nenhuma mensagem para hoje.
                    </p>

                {% endif %}

            </div>



            <!-- =========================
                 SISTEMA DE EMOÇÃO
            ========================== -->

            <div class="emocao">

                <h3>
                    Como você está se sentindo?
                </h3>


                <div class="emocoes">


                    <button
                        type="button"
                        class="emocao-btn"
                        data-emocao="muito-triste"
                        title="Muito triste"
                    >
                        😢
                    </button>


                    <button
                        type="button"
                        class="emocao-btn"
                        data-emocao="triste"
                        title="Triste"
                    >
                        😔
                    </button>


                    <button
                        type="button"
                        class="emocao-btn"
                        data-emocao="neutro"
                        title="Neutro"
                    >
                        😐
                    </button>


                    <button
                        type="button"
                        class="emocao-btn"
                        data-emocao="feliz"
                        title="Feliz"
                    >
                        🙂
                    </button>


                    <button
                        type="button"
                        class="emocao-btn"
                        data-emocao="muito-feliz"
                        title="Muito feliz"
                    >
                        😄
                    </button>

                </div>


                <p id="emocao-selecionada"></p>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>


</body>

</html>
